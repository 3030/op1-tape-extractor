name: Build App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate version file
        run: |
          echo "__version__ = \"1.0.${{ github.run_number }}\"" > version.py

      - name: Build macOS app (arm64)
        run: |
          pyinstaller mac-dev.spec --clean --noconfirm

      - name: Upload arm64 app
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-app
          path: dist/OP-1 Loop Extractor.app

  build-macos-intel:
    runs-on: macos-15-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate version file
        run: |
          echo "__version__ = \"1.0.${{ github.run_number }}\"" > version.py

      - name: Build macOS app (x86_64)
        run: |
          pyinstaller mac-dev.spec --clean --noconfirm

      - name: Upload x86_64 app
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-app
          path: dist/OP-1 Loop Extractor.app

  create-universal-macos:
    needs: [build-macos-arm64, build-macos-intel]
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Download arm64 app
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-app
          path: arm64-app

      - name: Download x86_64 app
        uses: actions/download-artifact@v4
        with:
          name: macos-x86_64-app
          path: x86_64-app

      - name: Debug - Check artifact structure
        shell: bash
        run: |
          set -euo pipefail
          echo "arm64-app tree:"
          find arm64-app -maxdepth 3 -print
          echo "x86_64-app tree:"
          find x86_64-app -maxdepth 3 -print

      - name: Create Universal App Bundle
        shell: bash
        run: |
          set -euo pipefail

          APP_NAME="OP-1 Loop Extractor"

          if [ -d "arm64-app/${APP_NAME}.app/Contents" ]; then
            ARM_APP="arm64-app/${APP_NAME}.app"
          elif [ -d "arm64-app/Contents" ]; then
            ARM_APP="arm64-app"
          else
            echo "ERROR: Could not find ARM app bundle"
            exit 1
          fi

          if [ -d "x86_64-app/${APP_NAME}.app/Contents" ]; then
            X86_APP="x86_64-app/${APP_NAME}.app"
          elif [ -d "x86_64-app/Contents" ]; then
            X86_APP="x86_64-app"
          else
            echo "ERROR: Could not find x86 app bundle"
            exit 1
          fi

          echo "ARM_APP=${ARM_APP}"
          echo "X86_APP=${X86_APP}"

          rm -rf universal-build
          mkdir -p universal-build
          cp -R "${ARM_APP}" "universal-build/${APP_NAME}.app"
          UNI_APP="universal-build/${APP_NAME}.app"

          lipo_pair() {
            local arm_file="$1"
            local x86_file="$2"
            local out_file="$3"

            mkdir -p "$(dirname "$out_file")"

            if [ -f "$x86_file" ]; then
              if lipo -create "$arm_file" "$x86_file" -output "$out_file" 2>/dev/null; then
                :
              else
                cp -f "$arm_file" "$out_file"
              fi
            else
              cp -f "$arm_file" "$out_file"
            fi
          }

          # Main executable
          lipo_pair \
            "${ARM_APP}/Contents/MacOS/${APP_NAME}" \
            "${X86_APP}/Contents/MacOS/${APP_NAME}" \
            "${UNI_APP}/Contents/MacOS/${APP_NAME}"

          chmod +x "${UNI_APP}/Contents/MacOS/${APP_NAME}"

          # Merge dylib/so found on ARM side
          while IFS= read -r arm_file; do
            rel_path="${arm_file#${ARM_APP}/}"
            x86_file="${X86_APP}/${rel_path}"
            out_file="${UNI_APP}/${rel_path}"
            lipo_pair "$arm_file" "$x86_file" "$out_file"
          done < <(find "${ARM_APP}" -type f \( -name "*.dylib" -o -name "*.so" \))

          # Copy dylib/so that exist only on x86 side
          while IFS= read -r x86_file; do
            rel_path="${x86_file#${X86_APP}/}"
            out_file="${UNI_APP}/${rel_path}"
            if [ ! -f "$out_file" ]; then
              mkdir -p "$(dirname "$out_file")"
              cp -f "$x86_file" "$out_file"
            fi
          done < <(find "${X86_APP}" -type f \( -name "*.dylib" -o -name "*.so" \))

          echo "Universal main binary architectures:"
          lipo -info "${UNI_APP}/Contents/MacOS/${APP_NAME}"

          mkdir -p dist
          rm -rf "dist/${APP_NAME}.app"
          mv "${UNI_APP}" "dist/${APP_NAME}.app"

      - name: Import Code Signing Certificate(s)
        env:
          CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
          CERTIFICATES_P12_PASSWORD: ${{ secrets.CERTIFICATES_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERTIFICATES_P12" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATES_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild \
            -T /usr/bin/security
          rm -f certificate.p12

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "Available codesigning identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
          echo "Available basic identities:"
          security find-identity -v -p basic "$KEYCHAIN_PATH" || true

      - name: Preserve universal binary
        shell: bash
        run: |
          set -euo pipefail
          APP_NAME="OP-1 Loop Extractor"
          # Save the universal (onefile) binary for Developer ID
          cp -R "dist/${APP_NAME}.app" "dist/${APP_NAME}-Devid.app"

      # -------------------------
      # Developer ID -> notarized DMG
      # -------------------------
      - name: Sign and Notarize App (Developer ID)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          APP_NAME="OP-1 Loop Extractor"
          APP_PATH="dist/${APP_NAME}-Devid.app"

          echo "Signing app (Developer ID)..."
          codesign --deep --force --options runtime \
            --entitlements entitlements.plist \
            --sign "Developer ID Application: Nathan Schmold (${APPLE_TEAM_ID})" \
            "$APP_PATH"

          codesign --verify --deep --verbose=2 "$APP_PATH"

          echo "Creating ZIP for notarization..."
          ditto -c -k --keepParent "$APP_PATH" "dist/${APP_NAME}-Devid.zip"

          echo "Submitting for notarization..."
          xcrun notarytool submit "dist/${APP_NAME}-Devid.zip" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_ID_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait

          echo "Stapling notarization ticket..."
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

          rm -f "dist/${APP_NAME}-Devid.zip"

      - name: Create DMG (Developer ID)
        shell: bash
        run: |
          set -euo pipefail
          APP_NAME="OP-1 Loop Extractor"
          hdiutil create \
            -volname "OP-1 Loop Extractor" \
            -srcfolder "dist/${APP_NAME}-Devid.app" \
            -ov -format UDZO \
            "dist/OP-1-Loop-Extractor-macOS.dmg"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: OP-1-Loop-Extractor-macOS
          path: dist/OP-1-Loop-Extractor-macOS.dmg

  release:
    needs: [create-universal-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/OP-1-Loop-Extractor-macOS/OP-1-Loop-Extractor-macOS.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
